<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactical Syndicate | Torn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d3d4cf; --panel:#e6e7e2; --ink:#1f2430; --muted:#566070; --line:#1f2430;
  --red:#b82a17; --yellow:#f2b90f; --on-dark:#f2f2ee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171b24;--panel:#222836;--ink:#e8e9e4;--muted:#9aa3b2;--line:#e8e9e4;--red:#e2523d;}
}
:root[data-theme="dark"]{--bg:#171b24;--panel:#222836;--ink:#e8e9e4;--muted:#9aa3b2;--line:#e8e9e4;--red:#e2523d;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;line-height:.95;margin:0;letter-spacing:.01em}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* hero: the faction name as street signage */
.hero{padding:44px 0 36px;border-bottom:6px solid var(--line)}
.hero .tag{font-weight:600;color:var(--muted);margin:0 0 10px}
.hero h1{font-size:clamp(64px,19vw,164px);text-transform:uppercase;word-break:break-word}
.hero p.lede{max-width:34em;font-size:19px;margin:18px 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 22px;font-weight:600;text-decoration:none;border:3px solid var(--line);border-radius:2px}
.btn.primary{background:var(--yellow);color:#1f2430;border-color:#1f2430}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:#1f2430;color:var(--yellow)}

section{padding:40px 0;border-bottom:2px solid var(--line)}
h2{font-size:clamp(36px,8vw,56px);margin-bottom:18px}

/* war status strip */
.war{background:var(--red);color:var(--on-dark);border-bottom:none}
.war .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;padding-top:18px;padding-bottom:18px}
.war strong{font:900 30px/1 "Big Shoulders Display",sans-serif}
.war span{opacity:.92}

.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid h3{font-size:30px;margin-bottom:6px}
.grid p{margin:0;color:var(--muted)}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:48px 1fr;gap:6px;padding:12px 0;border-top:1px solid var(--muted)}
ol.steps li::before{content:counter(s);font:900 36px/1 "Big Shoulders Display",sans-serif;color:var(--red)}

.rules{margin:0;padding-left:1.2em}
.rules li{margin:8px 0;max-width:40em}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;background:var(--panel)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--muted)}
th{font-family:"Big Shoulders Display",sans-serif;font-size:22px;border-bottom:3px solid var(--line)}

footer{padding:28px 0 40px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
</style>
</head>
<body>

<header class="hero"><div class="wrap">
  <p class="tag" id="tag"></p>
  <h1 id="name">Tactical Syndicate</h1>
  <p class="lede" id="lede"></p>
  <div class="btns">
    <a class="btn primary" id="join" href="#join-steps">Apply to join</a>
    <a class="btn" id="torn" href="#" target="_blank" rel="noopener">View us on Torn</a>
  </div>
</div></header>

<div class="war"><div class="wrap">
  <strong id="warStatus"></strong>
  <span id="warNote"></span>
</div></div>

<main>
<section><div class="wrap">
  <h2>What we’re about</h2>
  <div class="grid" id="pillars"></div>
</div></section>

<section id="join-steps"><div class="wrap">
  <h2>How to join</h2>
  <ol class="steps" id="steps"></ol>
</div></section>

<section><div class="wrap">
  <h2>Faction rules</h2>
  <ul class="rules" id="rules"></ul>
</div></section>

<section><div class="wrap">
  <h2>Ranks</h2>
  <div class="scroll"><table>
    <thead><tr><th>Rank</th><th>Who</th><th>What you do</th></tr></thead>
    <tbody id="ranks"></tbody>
  </table></div>
</div></section>
</main>

<footer><div class="wrap">
  <span id="foot"></span>
  <span>Not affiliated with Torn.</span>
</div></footer>

<script>
// ✏️ EDIT THIS BLOCK. Everything on the page comes from here.
const F = {
  name: "Tactical Syndicate",
  tag: "A Torn City faction",
  id: "56410",
  lede: "Active members, steady chains, and a leadership team that answers messages. Tell us what you’re working on and we’ll find you a place.",
  war: { status: "No active war", note: "Next ranked war details will be posted here." },
  discord: "", // paste your Discord invite link
  pillars: [
    ["Chaining", "We run chains around the clock. Hit when called and keep the timer alive."],
    ["Wars", "Ranked and territory wars with clear targets and calm call-outs."],
    ["Support", "Energy refills, armory loans and advice for new players."]
  ],
  steps: [
    "Make sure you’ve been in Torn for at least a week and check in daily.",
    "Open our faction page on Torn and press the join request.",
    "Message the leaders with your level and what you like doing.",
    "Join the Discord and say hello. You’ll get your rank there."
  ],
  rules: [
    "Stay active. Tell leadership if you’ll be away for more than a few days.",
    "Respond to war and chain calls when you can.",
    "Be decent to everyone, in game and in chat.",
    "Don’t attack faction members or allies."
  ],
  ranks: [
    ["Leader", "Your name", "Final call on wars and recruitment"],
    ["Co-leader", "Your name", "Runs chains, handles applications"],
    ["Member", "Everyone else", "Hit, chain, help each other"]
  ]
};

const $ = id => document.getElementById(id);
document.title = F.name + " | Torn";
$("name").textContent = F.name;
$("tag").textContent = F.tag;
$("lede").textContent = F.lede;
$("torn").href = "https://www.torn.com/factions.php?step=profile&ID=" + encodeURIComponent(F.id);
$("warStatus").textContent = F.war.status;
$("warNote").textContent = F.war.note;
if (F.discord) { $("join").href = F.discord; $("join").target = "_blank"; $("join").rel = "noopener"; $("join").textContent = "Join our Discord"; }
$("foot").textContent = F.name + " · Torn City";
F.pillars.forEach(([t, d]) => { const x = document.createElement("div"); x.innerHTML = "<h3></h3><p></p>"; x.children[0].textContent = t; x.children[1].textContent = d; $("pillars").append(x); });
F.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; $("steps").append(li); });
F.rules.forEach(r => { const li = document.createElement("li"); li.textContent = r; $("rules").append(li); });
F.ranks.forEach(r => { const tr = document.createElement("tr"); r.forEach(c => { const td = document.createElement("td"); td.textContent = c; tr.append(td); }); $("ranks").append(tr); });
</script>
</body>
</html>
